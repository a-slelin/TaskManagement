version: '3.8'

services:
  api:
    image: aslelin/task-management-api:1.0.0
    container_name: api
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      APP_PORT: ${APP_PORT}
      JWT_SECRET: ${JWT_SECRET}
      LOG_PATH: ${LOG_PATH}
    ports:
      - "${HOST_PORT}:${APP_PORT}"