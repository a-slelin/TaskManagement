version: '3.8'

services:
  auth:
    image: aslelin/task-management-auth:1.0.0
    container_name: auth
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      APP_PORT: ${APP_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      LOG_PATH: ${LOG_PATH}
    ports:
      - "${HOST_PORT}:${APP_PORT}"